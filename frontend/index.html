<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulseP — instant polls, real-time results." />
    <meta name="theme-color" content="#0b171b" />

    <!-- Apply saved theme before React loads — prevents flash -->
    <script>
      try {
        var t = localStorage.getItem("pulsep-theme");
        if (t === "light") {
          document.documentElement.className = "light";
          document.write('<style>body{background:#e8ede8!important;color:#0f2318!important}</style>');
        }
      } catch(e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,450;9..40,500;9..40,550;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PulseP — Instant polls. Real-time results.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
